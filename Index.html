<body>
     <div class="header">
            <h3>Character Creater</h3>
        </div>
    <div id="Container-1">
       
    <aside class="Switch-menu">
        <ul>
            <li><a href="Index.html"> Character Creater</a></li>

    <div class="MainContent">
        <!-- <select id="dropBox">
            <option>Character-inputs</option>
            <option>Character-Sheet</option>
        </select> -->
        <h3>Character name</h3>
        <input type="text" id="CharacterName">

        <h4 class="InputTitle">class</h4>
        <select for="classSelect" class="form-label" id="classSelect"> 
            <option>Class Select</option> 
        </select>

        <select id="SubclassSelect">
            <option value="">Select subclass</option>
        </select>
        <p id="subclassDescription"></p>
        <h4 class="InputTitle">Character Level</h4>
        <input id="LV" type="number" min="1" max="20">

        <h4 class="InputTitle">Background</h4>
        <select id="backgroundinput">
            <option>Select Background</option>
            
        </select>
    <h2>Inventory</h2>
    <p>Drag items to rearrange them.</p>

    <ul id="inventory" class="list-group mb-3">
        <!-- <li class="list-group-item">Spellbook</li>
        <li class="list-group-item">Backpack</li>
        <li class="list-group-item">Rope</li> -->
    </ul>

    <h2>Dice Roller</h2>
    <div class="input-group mb-2">
        <input id="diceNotation" class="form-control" value="1d20+3">
        <button id="rollButton" class="btn btn-primary">
            Roll
        </button>
    </div>
    <p id="diceResult" aria-live="polite">No roll yet</p>

    <button id="saveButton" class="btn btn-success">
        Save character
    </button>
    <button id="loadButton" class="btn btn-secondary">
        Load character
    </button>
    </div>
        <button id="CharacterCreatebutton" onclick="Character_SHeet()">Create Character</button>
    </div>
</body>
